[project]
name = "ax-study"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "myungjilee0914@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pydantic>=2.14.1",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
ax-study = "ax_study:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "streamlit/streamlit-app",
    "11_backend_api/chapter01-1",
    "11_backend_api/chapter01-2",
    "11_backend_api/chapter02-1",
    "11_backend_api/chapter03-1",
    "11_backend_api/chapter03-2",
    "11_backend_api/chapter04-1",
    "11_backend_api/chapter04-2",
    "11_backend_api/chapter05-1",
]
