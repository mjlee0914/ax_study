<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <ul class="menus">
        <li>메뉴1</li>
        <li>메뉴2</li>
        <li>메뉴3</li>
    </ul>

    <button
        type="button"
        onclick="
            const li = document.createElement('li');
            li.textContent = '새 메뉴';
            document.getElementsByClassName('menus')[0].appendChild(li);
        "
    >
        +
    </button>
</body>
</html>
