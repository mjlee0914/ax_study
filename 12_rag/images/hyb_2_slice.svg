<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect width="780" height="470" fill="#fcfcfb" rx="8"/>
<text x="30" y="34" font-size="17" font-weight="700" fill="#0b0b0b">② 슬라이싱 = 칼집 번호로 자르기</text>
<text x="30" y="56" font-size="12.5" fill="#52514e">번호는 칸이 아니라 칸 사이 '칼집'에 붙어 있다고 생각하면 '끝 번호 포함 X'가 바로 이해됨</text>
<rect x="140" y="100" width="100" height="44" fill="#f0efec" stroke="#a3a29c"/>
<text x="190.0" y="128" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">사과</text>
<rect x="240" y="100" width="100" height="44" fill="#f0efec" stroke="#a3a29c"/>
<text x="290.0" y="128" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">바나나</text>
<rect x="340" y="100" width="100" height="44" fill="#f0efec" stroke="#a3a29c"/>
<text x="390.0" y="128" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">체리</text>
<rect x="440" y="100" width="100" height="44" fill="#f0efec" stroke="#a3a29c"/>
<text x="490.0" y="128" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">딸기</text>
<rect x="540" y="100" width="100" height="44" fill="#f0efec" stroke="#a3a29c"/>
<text x="590.0" y="128" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">포도</text>
<line x1="140" x2="140" y1="92" y2="152" stroke="#0b0b0b" stroke-width="2"/>
<text x="140" y="170" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">0</text>
<text x="140" y="187" font-size="11" fill="#52514e" text-anchor="middle">-5</text>
<line x1="240" x2="240" y1="92" y2="152" stroke="#0b0b0b" stroke-width="2"/>
<text x="240" y="170" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">1</text>
<text x="240" y="187" font-size="11" fill="#52514e" text-anchor="middle">-4</text>
<line x1="340" x2="340" y1="92" y2="152" stroke="#0b0b0b" stroke-width="2"/>
<text x="340" y="170" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">2</text>
<text x="340" y="187" font-size="11" fill="#52514e" text-anchor="middle">-3</text>
<line x1="440" x2="440" y1="92" y2="152" stroke="#0b0b0b" stroke-width="2"/>
<text x="440" y="170" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">3</text>
<text x="440" y="187" font-size="11" fill="#52514e" text-anchor="middle">-2</text>
<line x1="540" x2="540" y1="92" y2="152" stroke="#0b0b0b" stroke-width="2"/>
<text x="540" y="170" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">4</text>
<text x="540" y="187" font-size="11" fill="#52514e" text-anchor="middle">-1</text>
<line x1="640" x2="640" y1="92" y2="152" stroke="#0b0b0b" stroke-width="2"/>
<text x="640" y="170" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">5</text>
<text x="30" y="170" font-size="11.5" fill="#52514e">칼집 번호</text>
<text x="30" y="187" font-size="11.5" fill="#52514e">뒤에서 세면</text>
<text x="30" y="240" font-size="14" font-weight="700" fill="#0b0b0b" font-family="Menlo, monospace">fruits[:3]</text>
<rect x="143" y="218" width="294" height="34" rx="7" fill="#dbe9fa" stroke="#2a78d6" stroke-width="1.5"/>
<text x="290.0" y="240" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">사과, 바나나, 체리</text>
<text x="654" y="234" font-size="11.5" fill="#52514e">앞에서 3개</text>
<text x="654" y="249" font-size="11.5" font-weight="700" fill="#2a78d6">3개</text>
<text x="30" y="290" font-size="14" font-weight="700" fill="#0b0b0b" font-family="Menlo, monospace">fruits[1:3]</text>
<rect x="243" y="268" width="194" height="34" rx="7" fill="#dbe9fa" stroke="#2a78d6" stroke-width="1.5"/>
<text x="340.0" y="290" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">바나나, 체리</text>
<text x="654" y="284" font-size="11.5" fill="#52514e">칼집 1 ~ 3</text>
<text x="654" y="299" font-size="11.5" font-weight="700" fill="#2a78d6">2개</text>
<text x="30" y="340" font-size="14" font-weight="700" fill="#0b0b0b" font-family="Menlo, monospace">fruits[2:]</text>
<rect x="343" y="318" width="294" height="34" rx="7" fill="#dbe9fa" stroke="#2a78d6" stroke-width="1.5"/>
<text x="490.0" y="340" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">체리, 딸기, 포도</text>
<text x="654" y="334" font-size="11.5" fill="#52514e">칼집 2 ~ 끝</text>
<text x="654" y="349" font-size="11.5" font-weight="700" fill="#2a78d6">3개</text>
<text x="30" y="390" font-size="14" font-weight="700" fill="#0b0b0b" font-family="Menlo, monospace">fruits[-2:]</text>
<rect x="443" y="368" width="194" height="34" rx="7" fill="#dbe9fa" stroke="#2a78d6" stroke-width="1.5"/>
<text x="540.0" y="390" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">딸기, 포도</text>
<text x="654" y="384" font-size="11.5" fill="#52514e">뒤에서 2개</text>
<text x="654" y="399" font-size="11.5" font-weight="700" fill="#2a78d6">2개</text>
<text x="30" y="436" font-size="12" fill="#52514e">개수 = 끝 - 시작 (예: [1:3] → 3 - 1 = 2개)</text>
<text x="30" y="454" font-size="12" fill="#52514e">fruits[:10]처럼 칼집이 없는 번호를 넣어도 에러 없이 있는 만큼(5개)만 줌</text>
</svg>