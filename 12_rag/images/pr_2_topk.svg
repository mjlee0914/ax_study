<text x="30" y="34" font-size="17" font-weight="700" fill="#0b0b0b">② 문서를 많이 가져올수록? (정밀도 ↔ 재현율 시소)</text>
<text x="30" y="56" font-size="12.5" fill="#52514e">관련 문서가 총 5개 있을 때, 검색 결과를 몇 개(top-k)까지 가져오느냐에 따라</text>
<line x1="70" x2="540" y1="350.0" y2="350.0" stroke="#e4e3df"/>
