<text x="416.3" y="368" font-size="11" fill="#52514e" text-anchor="middle">15</text>
<text x="540.0" y="368" font-size="11" fill="#52514e" text-anchor="middle">20</text>
<line x1="70" x2="540" y1="350" y2="350" stroke="#52514e"/>
<text x="305.0" y="390" font-size="12" fill="#52514e" text-anchor="middle">가져온 문서 수 (top-k)</text>
<line x1="168.9" x2="168.9" y1="80" y2="350" stroke="#a3a29c" stroke-dasharray="4 4"/>
<text x="174.9" y="92" font-size="11.5" fill="#52514e">k=5: 정밀도 60% · 재현율 60%</text>
