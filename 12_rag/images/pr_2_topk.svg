<text x="62" y="286.5" font-size="11" fill="#52514e" text-anchor="end">25%</text>
<line x1="70" x2="540" y1="215.0" y2="215.0" stroke="#e4e3df"/>
<text x="62" y="219.0" font-size="11" fill="#52514e" text-anchor="end">50%</text>
