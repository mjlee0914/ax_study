<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 420" width="750" height="420" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<rect width="750" height="420" fill="#fcfcfb" rx="8"/>
<text x="30" y="34" font-size="17" font-weight="700" fill="#0b0b0b">① 그물로 보는 정밀도 · 재현율</text>
<text x="30" y="56" font-size="12.5" fill="#52514e">바다에 물고기 10마리 · 그물에 걸린 것: 물고기 6 + 쓰레기 2</text>
<rect x="30" y="76" width="400" height="300" rx="10" fill="#e8f1fb"/>
<text x="44" y="98" font-size="12" fill="#52514e">🌊 바다 (전체 문서)</text>
<circle cx="190" cy="235" r="105" fill="#eb6834" fill-opacity="0.08" stroke="#eb6834" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="190" y="122" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">🕸️ 그물 (검색 결과)</text>
<text x="150" y="185" font-size="24" text-anchor="middle">🐟</text>
<text x="205" y="175" font-size="24" text-anchor="middle">🐟</text>
<text x="245" y="215" font-size="24" text-anchor="middle">🐟</text>
<text x="135" y="245" font-size="24" text-anchor="middle">🐟</text>
<text x="195" y="240" font-size="24" text-anchor="middle">🐟</text>
<text x="235" y="275" font-size="24" text-anchor="middle">🐟</text>
<text x="160" y="300" font-size="22" text-anchor="middle">🥾</text>
<text x="115" y="205" font-size="22" text-anchor="middle">🥾</text>
<text x="345" y="130" font-size="24" text-anchor="middle" opacity="0.55">🐟</text>
<text x="370" y="230" font-size="24" text-anchor="middle" opacity="0.55">🐟</text>
<text x="335" y="320" font-size="24" text-anchor="middle" opacity="0.55">🐟</text>
<text x="390" y="290" font-size="24" text-anchor="middle" opacity="0.55">🐟</text>
<text x="365" y="356" font-size="11.5" fill="#52514e" text-anchor="middle">못 잡은 물고기 (FN)</text>
<text x="460" y="110" font-size="15" font-weight="700" fill="#0b0b0b">정밀도 (Precision)</text>
<text x="460" y="130" font-size="12" fill="#52514e">그물에 걸린 것 중 진짜 물고기는?</text>
<rect x="460" y="142" width="220" height="18" rx="4" fill="#e4e3df"/>
<rect x="460" y="142" width="165.0" height="18" rx="4" fill="#eb6834"/>
<text x="688" y="156" font-size="14" font-weight="700" fill="#0b0b0b">75%</text>
<text x="460" y="182" font-size="12.5" fill="#0b0b0b">🐟 6 ÷ (🐟 6 + 🥾 2) = 6/8</text>
<text x="460" y="235" font-size="15" font-weight="700" fill="#0b0b0b">재현율 (Recall)</text>
<text x="460" y="255" font-size="12" fill="#52514e">바다의 물고기 중 몇 마리 잡았나?</text>
<rect x="460" y="267" width="220" height="18" rx="4" fill="#e4e3df"/>
<rect x="460" y="267" width="132.0" height="18" rx="4" fill="#2a78d6"/>
<text x="688" y="281" font-size="14" font-weight="700" fill="#0b0b0b">60%</text>
<text x="460" y="307" font-size="12.5" fill="#0b0b0b">🐟 6 ÷ (🐟 6 + 놓친 🐟 4) = 6/10</text>
<text x="460" y="360" font-size="11.5" fill="#52514e">TP 🐟 6 · FP 🥾 2 · FN 놓친 🐟 4</text>
</svg>