<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="720" height="450" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<rect width="720" height="450" fill="#fcfcfb" rx="8"/>
<text x="30" y="34" font-size="17" font-weight="700" fill="#0b0b0b">② 리랭킹 전후 순위 변화</text>
<text x="30" y="56" font-size="12.5" fill="#52514e">질문: "강아지가 초콜릿 먹으면 어떻게 돼?"</text>
<text x="270" y="92" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">1차 검색</text>
<text x="450" y="92" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">리랭킹 후</text>
<line x1="390" x2="700" y1="336" y2="336" stroke="#e4e3df" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="700" y="330" font-size="11" fill="#52514e" text-anchor="end">LLM에 안 보냄 ↓</text>
<line x1="270" y1="110" x2="450" y2="210" stroke="#eb6834" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="270" cy="110" r="5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="450" cy="210" r="5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<text x="258" y="114" font-size="12" fill="#0b0b0b" text-anchor="end">간식 추천: 초콜릿맛 쿠키 <tspan font-weight="700">1등</tspan></text>
<text x="462" y="214" font-size="12" fill="#0b0b0b"><tspan font-weight="700">3등</tspan> ⬇️ 간식 추천: 초콜릿맛 쿠키</text>
<line x1="270" y1="160" x2="450" y2="360" stroke="#eb6834" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="270" cy="160" r="5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="450" cy="360" r="5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<text x="258" y="164" font-size="12" fill="#0b0b0b" text-anchor="end">초콜릿의 역사 <tspan font-weight="700">2등</tspan></text>
<text x="462" y="364" font-size="12" fill="#0b0b0b"><tspan font-weight="700">탈락</tspan> ❌ 초콜릿의 역사</text>
<line x1="270" y1="210" x2="450" y2="110" stroke="#2a78d6" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="270" cy="210" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="450" cy="110" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="258" y="214" font-size="12" fill="#0b0b0b" text-anchor="end">강아지 초콜릿 중독 증상과 응급처치 <tspan font-weight="700">3등</tspan></text>
<text x="462" y="114" font-size="12" fill="#0b0b0b"><tspan font-weight="700">1등</tspan> ⬆️ 강아지 초콜릿 중독 증상과 응급처치</text>
<line x1="270" y1="260" x2="450" y2="160" stroke="#2a78d6" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="270" cy="260" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="450" cy="160" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="258" y="264" font-size="12" fill="#0b0b0b" text-anchor="end">반려견이 먹으면 안 되는 음식 <tspan font-weight="700">4등</tspan></text>
<text x="462" y="164" font-size="12" fill="#0b0b0b"><tspan font-weight="700">2등</tspan> ⬆️ 반려견이 먹으면 안 되는 음식</text>
<line x1="270" y1="310" x2="450" y2="260" stroke="#2a78d6" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="270" cy="310" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="450" cy="260" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="258" y="314" font-size="12" fill="#0b0b0b" text-anchor="end">초콜릿 성분 테오브로민의 독성 <tspan font-weight="700">5등</tspan></text>
<text x="462" y="264" font-size="12" fill="#0b0b0b"><tspan font-weight="700">4등</tspan> ⬆️ 초콜릿 성분 테오브로민의 독성</text>
<line x1="30" x2="50" y1="424" y2="424" stroke="#2a78d6" stroke-width="3" stroke-linecap="round"/>
<text x="58" y="428" font-size="12" fill="#52514e">순위 올라감 (진짜 답이 되는 문서)</text>
<line x1="310" x2="330" y1="424" y2="424" stroke="#eb6834" stroke-width="3" stroke-linecap="round"/>
<text x="338" y="428" font-size="12" fill="#52514e">순위 내려감 / 탈락 (단어만 비슷한 문서)</text>
</svg>