<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        .box {
            width: 150px;
            height: 150px;
            background: orange;
            transition: all 0.5s;
        }

        .box:hover{
            width: 300px;
            height: 300px;
            background-color: blue;
            rotate: 270deg;
        }

        .text:focus {
            background-color: yellow;
        }
        .text:blur {
            border-color: blue;
        }

        .tab-group {
            width: 400px;
            display: flex;
            align-items: center;
            height: 100px;
        }
        .tab-group input[type='radio'] {
            display: none;
        }

        .tab-group label {
            border: 1px solid #ccc;
            padding: 20px 15px;
            margin: 0 5px;
        }

        .tab-group input[type='radio']:checked+label {
            border-color: #000;
            background-color: #000;
            color: #fff;
        }
    </style>

    <div class="box"></div><br>
    <input type="text" class="text"><br><br>

    <div class="tab-group">
    <input type="radio" class="tab" value="menu1" id="tab1">
    <label for="tab1">메뉴1</label>
    
    <input type="radio" class="tab" value="menu3" id="tab2">
    <label for="tab2">메뉴2</label>

    <input type="radio" class="tab" value="menu2" id="tab3">
    <label for="tab3">메뉴3</label>   
    </div>
</html>
