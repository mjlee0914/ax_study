<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>combinator practice 2</title>
</head>
<body>
    <style>
        .menu5~ li {
            background-color: gray;
        }
        .menu5 + li {
            background-color: rgb(209, 246, 176);
        }
    </style>
    <ul>
        <li class="menu1">menu1</li>
        <li>menu2</li>
        <li>menu3</li>
        <li>menu4</li>
        <li class="menu5">menu5</li>
        <li>menu6</li>
        <li>menu7</li>
        <li>menu8</li>
        <li>menu9</li>
        <li>menu10</li>
    </ul>
</body>
</html>
