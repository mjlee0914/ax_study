<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>import font</title>
</head>
<body>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Rubik+Puddles&display=swap');

    @font-face {
        font-family:'Honk';
        src: url(/Users/myungjilee/Desktop/Kant/ax_study/07_frontend_basic/chapter02/01/font/Honk-Regular-VariableFont_MORF,SHLN.ttf), ;
        font-display: swap; /* 폰트 로딩 전에 기본 폰트 적용, 로딩 끝나면 현재 폰트로 적용 */
    }
    
    div {
        font-family: "Rubik Puddles";
        font-size: 50px;
        color: rgb(22, 188, 158);
        background-color: rgb(231, 236, 241);
    }

    h3 {
        font-family: "Honk";
        font-size: 50px;
    }
    .w-100 {
        font-weight: 100;
    }
    .w-200 {
        font-weight: 200;
    }
    .w-300 {
        font-weight: 300;
    }
    .w-400 {
        font-weight: 400;
    }
    .w-500 {
        font-weight: 500;
    }
    .w-600 {
        font-weight: 600;
    }
    .w-700 {
        font-weight: 700;
    }
    .w-800 {
        font-weight: 800;
    }
    .w-900 {
        font-weight: 900;
    }
    </style>
    
    <div class="w-100">
        Rubik Puddles Font
    </div>
    <div class="w-200">
        Rubik Puddles Font
    </div>
    <div class="w-300">
        Rubik Puddles Font
    </div>
    <div class="w-400">
        Rubik Puddles Font
    </div>
    <div class="w-500">
        Rubik Puddles Font
    </div>
    <div class="w-600">
        Rubik Puddles Font
    </div>
    <div class="w-700">
        Rubik Puddles Font
    </div>
    <div class="w-800">
        Rubik Puddles Font
    </div>
    <div class="w-900">
        Rubik Puddles Font
    </div>

    <h3>Honk Font</h3>

</html>
