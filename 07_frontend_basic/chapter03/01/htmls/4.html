<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex-grow</title>
</head>
<body>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
        }

        ul {
            list-style: none;
            margin: 0;
            padding: 0;
            border: 1px solid #000;
            height: 100px;
        }

        li {
            /*min-width: 100px;*/
            width: 0;
        }

        li:nth-of-type(1) {
            background: rgb(247, 202, 202);
            flex-grow:1
        }

        li:nth-of-type(2) {
            background: rgb(197, 197, 232);
            flex-grow: 1;
        }

        li:nth-of-type(3) {
            background: rgb(180, 231, 180);
            flex-grow:1
        }

        .flex1 {
            display: flex;
        }


    </style>

    <h3>flex-grow, 요소에 적용 (메뉴에 하나씩 적용)</h3>
    <ul class="flex1">
        <li>메뉴1</li>
        <li>메뉴2</li>
        <li>메뉴3</li>
    </ul>

</body>
</html>
