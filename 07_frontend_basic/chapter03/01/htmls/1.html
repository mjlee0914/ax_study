<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex-direction</title>
</head>
<body>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
        }

        ul {
            list-style: none;
            margin: 0;
            padding: 0;
            border: 1px solid #000;
            height: 100px;
        }

        li {
            min-width: 100px;
        }

        li:nth-of-type(1) {
            background: rgb(247, 202, 202);
        }

        li:nth-of-type(2) {
            background: rgb(197, 197, 232);
        }

        li:nth-of-type(3) {
            background: rgb(180, 231, 180);
        }

        .flex1 {
            display: flex;
        }

        .flex2 {
            display: flex;
            flex-direction: row-reverse;
        }

        .flex3 {
            display: flex;
            flex-direction: column;
        }

        .flex4 {
            display: flex;
            flex-direction: column-reverse;
        }

    </style>

    <h3>flex-direction: row(좌 -> 우)</h3>
    <ul class="flex1">
        <li>메뉴1</li>
        <li>메뉴2</li>
        <li>메뉴3</li>
    </ul>

    <h3>flex-direction: row-reverse (우->좌)</h3>
        <ul class="flex2">
        <li>메뉴1</li>
        <li>메뉴2</li>
        <li>메뉴3</li>
    </ul>

    <h3>flex-direction: column (위 -> 아래)</h3>
        <ul class="flex3">
        <li>메뉴1</li>
        <li>메뉴2</li>
        <li>메뉴3</li>
    </ul>

    <h3>flex-direction: column-reverse (아래 -> 위)</h3>
        <ul class="flex4">
        <li>메뉴1</li>
        <li>메뉴2</li>
        <li>메뉴3</li>
    </ul>

</body>
</html>
