<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Form Tag</title>
    </head>

    <body>
        <h1>회원가입</h1>
        <hr>
        <form>
            이메일: <input type="text"> <br>
            비밀번호: <input type="password"> <br>
            비밀번호 확인: <input type="password"> <br>
            회원 이름: <input type="text"> <br>
            성별
                <label><input type="radio" name="gender" value="female" checked>여성</label>
                <label><input type="radio" name="gender" value="male">남성<br></label>  
            취미
                <label><input type="checkbox">파이썬 공부</label>
                <label><input type="checkbox">머신러닝 공부</label>
                <label><input type="checkbox">독서</label>  
            <br>
            <input type="submit" value="제출">
        </form>
    </body>

</html>
