<!DOCTYPE HTML>
<html>
    <head>
        <meta charset = "utf-8">
    </head>
    <body>
        <!-- <style> 안 tag별 CSS 설정-->
        <style>
            div {
                width: 150px;
                height: 150px;
                background: rgb(188, 159, 214);
            }
            span {
                width: 150px;
                height: 150px;
                background: rgb(253, 146, 107);
            }
        </style>

        <!--Block: vertical -->
        <p>A</p>
        <p>B</p>
        <div>C</div>

        <!--Inline: horizontal -->
        <i>D</i>
        <b>E</b>
        <span>F</span>
    </body>
</html>
